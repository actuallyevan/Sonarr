name: Publish Release Binaries

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name the release is built from'
        required: true
        default: main
  workflow_call:
    inputs:
      branch:
        description: 'Branch name the release is built from'
        required: true
        type: string
        default: main
      fork_tag:
        type: string
        required: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Extract Version
        id: get_version
        shell: bash
        run: |
          TAG="${{ inputs.fork_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0.0")
          fi
          FORK_VERSION="${TAG#v}"
          UPSTREAM_VERSION="${FORK_VERSION%%-*}"

          echo "FORK_TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "FORK_VERSION=$FORK_VERSION" >> "$GITHUB_OUTPUT"
          echo "UPSTREAM_VERSION=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract Target Framework
        shell: bash
        run: |
          FRAMEWORK=$(git grep -h -m 1 "<TargetFrameworks>" src/NzbDrone.Core/ | sed -e 's/.*<TargetFrameworks>\(.*\)<\/TargetFrameworks>.*/\1/')
          echo "FRAMEWORK=$FRAMEWORK" >> "$GITHUB_ENV"

      - name: Set up Node.js (Volta)
        uses: volta-cli/action@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build All Backend & Frontend Packages
        shell: bash
        run: ./build.sh --backend --frontend --packages -f "${{ env.FRAMEWORK }}"
        env:
          SONARR_VERSION: ${{ steps.get_version.outputs.UPSTREAM_VERSION }}
          BRANCH: ${{ inputs.branch }}

      - name: Build Windows Installers
        working-directory: distribution/windows/setup
        shell: bash
        run: |
          mkdir -p ../../../_output/win-x64/${{ env.FRAMEWORK }}/Sonarr
          cp -r ../../../_artifacts/win-x64/${{ env.FRAMEWORK }}/Sonarr/* ../../../_output/win-x64/${{ env.FRAMEWORK }}/Sonarr/

          mkdir -p ../../../_output/win-x86/${{ env.FRAMEWORK }}/Sonarr
          cp -r ../../../_artifacts/win-x86/${{ env.FRAMEWORK }}/Sonarr/* ../../../_output/win-x86/${{ env.FRAMEWORK }}/Sonarr/

          export SONARR_VERSION="${{ steps.get_version.outputs.FORK_VERSION }}"
          UPSTREAM_VERSION="${{ steps.get_version.outputs.UPSTREAM_VERSION }}"
          export SONARR_MAJOR_VERSION="${UPSTREAM_VERSION%%.*}"
          export BRANCH="${{ inputs.branch }}"
          export FRAMEWORK="${{ env.FRAMEWORK }}"

          RUNTIME=win-x64 ./inno/ISCC.exe sonarr.iss
          RUNTIME=win-x86 ./inno/ISCC.exe sonarr.iss

      - name: Install zip tool
        shell: cmd
        run: choco install zip -y

      - name: Package Archives (.tar.gz / .zip)
        shell: bash
        run: .github/actions/package/package.sh
        env:
          FRAMEWORK: ${{ env.FRAMEWORK }}
          BRANCH: ${{ inputs.branch }}
          SONARR_VERSION: ${{ steps.get_version.outputs.FORK_VERSION }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.FORK_TAG }}
          name: Sonarr v${{ steps.get_version.outputs.FORK_VERSION }}
          body: |
            Based on upstream Sonarr [v${{ steps.get_version.outputs.UPSTREAM_VERSION }}](https://github.com/Sonarr/Sonarr/releases/tag/v${{ steps.get_version.outputs.UPSTREAM_VERSION }}).
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            _artifacts/*.tar.gz
            _artifacts/*.zip
            _artifacts/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
